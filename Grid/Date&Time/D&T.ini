[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Microma Minimal Drive Widget
Author=OpenAI
Information=Minimal automotive-inspired clock widget.
Version=2.0

; ============================================================
; MEASURES
; ============================================================

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%a, %b %d

; ============================================================
; TOP NAVIGATION
; ============================================================

[MeterTop]
Meter=String
X=45
Y=22
W=190
H=18
Text=D R I V E   //   F O C U S   //   R E P E A T
FontFace=BankGothic Lt BT
FontSize=9
FontColor=45,45,45,255
StringStyle=Normal
AntiAlias=1
CharacterSpacing=2

; ============================================================
; LEFT RED ACCENT
; ============================================================

[MeterRedTop]
Meter=Shape
X=11
Y=61
Shape=Rectangle 0,0,2,31 | Fill Color 235,55,55,255 | StrokeWidth 0

[MeterWhiteTop]
Meter=Shape
X=11
Y=80
Shape=Rectangle 0,0,2,30 | Fill Color 255,255,255,255 | StrokeWidth 0

; ============================================================
; MAIN CLOCK
; Kept large, but moved upward enough to leave clean space
; for the date underneath.
; ============================================================

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=20
Y=53
W=345
H=80
Text=%1
FontFace=Microgramma Bold
FontSize=49
FontColor=5,5,5,255
StringStyle=Regular
AntiAlias=1
ClipString=0

; ============================================================
; RIGHT RED ACCENT
; ============================================================

[MeterRedSide]
Meter=Shape
X=315
Y=125
Shape=Rectangle 0,0,2,18 | Fill Color 235,55,55,255 | StrokeWidth 0

; ============================================================
; DATE
; Positioned BELOW the clock, never overlapping it.
; ============================================================

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=43
Y=125
W=230
H=25
Text=%1
FontFace=JetBrainsMono NFP
FontSize=12
FontColor=20,20,20,255
StringStyle=Normal
AntiAlias=1
CharacterSpacing=1

; ============================================================
; QUOTE
; ============================================================

[MeterQuote1]
Meter=String
X=36
Y=168
W=330
H=15
Text=""GOOD DRIVERS PUSH THE LIMITS"
FontFace=Cascadia Mono
FontSize=10
FontColor=70,70,70,255
StringStyle=Bold
AntiAlias=1
CharacterSpacing=1

[MeterQuote2]
Meter=String
X=36
Y=190
W=350
H=15
Text="GREAT DRIVERS FIND A HIGHER ONE. " "
FontFace=Cascadia Mono
FontSize=10
FontColor=70,70,70,255
StringStyle=Bold
AntiAlias=1
CharacterSpacing=1

; ============================================================
; BOTTOM RED ACCENT
; ============================================================

[MeterRedBottom]
Meter=Shape
X=36
Y=220
Shape=Rectangle 0,0,25,2 | Fill Color 235,55,55,255 | StrokeWidth 0
