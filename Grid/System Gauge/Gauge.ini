[Rainmeter]
Update=100
AccurateText=1
DynamicWindowSize=1
OnDesktop=1
KeepOnScreen=0

[Variables]
FontFace=Michroma
FontColor=0,0,0,255
TrackColor=0,0,0,40
SubTextColor=80,80,80,255
RedZoneColor=220,30,30,255

; --- MEASURES ---
[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory

[MeasureGPU]
Measure=Plugin
Plugin=MSIAfterburner.dll
MSIAfterburnerGPU=0
MSIAfterburnerField=GPU Usage
MinValue=0
MaxValue=100

; ================= GAUGE 1: CPU =================
[MeterCPUTrack]
Meter=Roundline
X=10
Y=10
W=120
H=120
StartAngle=2.23
RotationAngle=4.20
LineLength=52
LineStart=44
LineColor=#TrackColor#
Solid=1
AntiAlias=1

; --- Measurement Tick Marks ---
[MeterCPUTicks]
Meter=Shape
X=10
Y=10
Shape=Path TickPath | Stroke Color 0,0,0,180 | StrokeWidth 1.5 | StrokeCap Round
TickPath=Move 22,90 | Line 14,95 | Move 20,68 | Line 12,68 | Move 25,48 | Line 18,44 | Move 38,32 | Line 32,26 | Move 56,22 | Line 54,14 | Move 76,20 | Line 78,12 | Move 94,28 | Line 98,20 | Move 106,42 | Line 112,38

[MeterCPUBAR]
Meter=Roundline
MeasureName=MeasureCPU
X=10
Y=10
W=120
H=120
StartAngle=2.23
RotationAngle=4.20
LineLength=52
LineStart=44
LineColor=#FontColor#
Solid=1
AntiAlias=1

[MeterCPURedZone]
Meter=Roundline
X=10
Y=10
W=120
H=120
StartAngle=5.50
RotationAngle=0.93
LineLength=53
LineStart=43
LineColor=#RedZoneColor#
Solid=1
AntiAlias=1

[MeterCPULabel]
Meter=String
Text="CPU"
FontFace=Horizon
FontSize=10
FontColor=#FontColor#
X=70
Y=64
StringAlign=Center
AntiAlias=1

[MeterCPUValue]
Meter=String
MeasureName=MeasureCPU
FontFace=#FontFace#
FontSize=18
FontColor=#FontColor#
X=110
Y=82
StringAlign=Right
AntiAlias=1
Text="%1"


