[Rainmeter]
Update=100
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Romit Browser Music Player
Author=Romit
Information=Minimal browser music player using WebNowPlaying
Version=1.1

[Variables]
PanelW=150
PanelH=182
Font=Segoe UI
TextColor=0,0,0,255
MutedColor=115,115,115,255
AccentColor=240,35,48,255
TrackColor=180,180,180,255

; ============================================================
; WEBNOWPLAYING
; ============================================================

[MeasureStatus]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Status
UpdateDivider=2

[MeasurePlayer]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Player
UpdateDivider=2
Substitute="":""

[MeasureTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title
UpdateDivider=2
Substitute="":"Nothing Playing"

[MeasureArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist
UpdateDivider=1
Substitute="":""

[MeasureCover]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover
DefaultPath=default_cover.png
CoverPath=cover.png
UpdateDivider=2

[MeasureProgress]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Progress
UpdateDivider=1

[MeasurePlayPause]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State
UpdateDivider=1

IfCondition=(MeasurePlayPause = 1)
IfTrueAction=[!SetOption MeterPlayPause ImageName "pause.png"][!UpdateMeter MeterPlayPause][!Redraw]

IfCondition2=(MeasurePlayPause = 2)
IfTrueAction2=[!SetOption MeterPlayPause ImageName "play.png"][!UpdateMeter MeterPlayPause][!Redraw]

IfCondition3=(MeasurePlayPause = 0)
IfTrueAction3=[!SetOption MeterPlayPause ImageName "play.png"][!UpdateMeter MeterPlayPause][!Redraw]



; ============================================================
; COVER
; ============================================================

[MeterCover]
Meter=Image
MeasureName=MeasureCover
X=18
Y=8
W=72
H=72
PreserveAspectRatio=2
AntiAlias=1

; ============================================================
; TITLE
; IMPORTANT: StringAlign=Center means X is the CENTER point.
; ============================================================

[MeterTitle]
Meter=String
MeasureName=MeasureTitle
X=75
Y=87
W=120
H=17
FontFace=JetBrainsMono NFP
FontSize=10
FontColor=#TextColor#
StringAlign=Center
ClipString=1
AntiAlias=1
Text=%1

[MeterArtist]
Meter=String
MeasureName=MeasureArtist
X=75
Y=104
W=120
H=15
FontFace=#Font#
FontSize=8
FontColor=#MutedColor#
StringAlign=Center
ClipString=1
AntiAlias=1
Text=%1

; ============================================================
; PROGRESS
; ============================================================

[MeterProgressBG]
Meter=Shape
Shape=Rectangle 20,125,110,3,1 | Fill Color #TrackColor# | StrokeWidth 0

[MeterProgress]
Meter=Bar
MeasureName=MeasureProgress
X=20
Y=125
W=110
H=3
BarColor=#AccentColor#
SolidColor=0,0,0,0
BarOrientation=Horizontal
AntiAlias=1

; ============================================================
; CONTROLS
; ============================================================

[MeterPrevious]
Meter=Image
ImageName=prev.png
X=39
Y=139
W=15
H=15
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Previous"]

[MeterPlayPause]
Meter=Image
ImageName=play.png
X=67
Y=137
W=18
H=18
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasurePlayPause "PlayPause"]

[MeterNext]
Meter=Image
ImageName=next.png
X=97
Y=139
W=15
H=15
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureTitle "Next"]

; ============================================================
; PLAYER NAME
; ============================================================

[MeterPlayer]
Meter=String
MeasureName=MeasurePlayer
X=75
Y=162
W=120
H=12
FontFace=#Font#
FontSize=7
FontColor=#MutedColor#
StringAlign=Center
ClipString=1
AntiAlias=1
Text=%1
