[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnDesktop=1
KeepOnScreen=1

[Variables]
; ============================================================
; SMALL GLASS PANEL
; ============================================================
; Original glass image ratio: 487 x 1078
PanelW=130
PanelH=320

; Button / icon size
ButtonSize=30
IconSize=28

; Centered on 180 px panel
ButtonX=65

; Vertical positions
ThisPCY=60
DownloadsY=150
RecycleY=240

; Text
TextX=40
TextW=100
TextYOffset=52

; ============================================================
; GLASS BACKGROUND
; ============================================================
[MeterGlass]
Meter=Image
ImageName=glass.png
X=0
Y=0
W=#PanelW#
H=#PanelH#
AntiAlias=1

; ============================================================
; THIS PC
; ============================================================
[ButtonThisPC]
Meter=Shape
X=#ButtonX#
Y=#ThisPCY#
Shape=Ellipse 0,0,#ButtonSize#,#ButtonSize# | Fill Color 3,4,5,245 | StrokeWidth 1 | Stroke Color 255,255,255,35
MouseOverAction=[!SetOption ButtonThisPC Shape "Ellipse 0,0,#ButtonSize#,#ButtonSize# | Fill Color 12,13,14,250 | StrokeWidth 1 | Stroke Color 255,255,255,75"][!UpdateMeter ButtonThisPC][!Redraw]
MouseLeaveAction=[!SetOption ButtonThisPC Shape "Ellipse 0,0,#ButtonSize#,#ButtonSize# | Fill Color 3,4,5,245 | StrokeWidth 1 | Stroke Color 255,255,255,35"][!UpdateMeter ButtonThisPC][!Redraw]
LeftMouseUpAction=["shell:MyComputerFolder"]
CursorName=Hand

[IconThisPC]
Meter=Image
ImageName=pc.png
X=52
Y=47
W=#IconSize#
H=#IconSize#
AntiAlias=1
LeftMouseUpAction=["shell:MyComputerFolder"]
CursorName=Hand

[TextThisPC]
Meter=String
Text=This PC
X=64
Y=95
W=#TextW#
H=18
StringAlign=Center
FontFace=Segoe UI
FontSize=8
FontColor=245,245,245,255
AntiAlias=1
LeftMouseUpAction=["shell:MyComputerFolder"]
CursorName=Hand

; ============================================================
; DOWNLOADS
; ============================================================
[ButtonDownloads]
Meter=Shape
X=#ButtonX#
Y=#DownloadsY#
Shape=Ellipse 0,0,#ButtonSize#,#ButtonSize# | Fill Color 3,4,5,245 | StrokeWidth 1 | Stroke Color 255,255,255,35
MouseOverAction=[!SetOption ButtonDownloads Shape "Ellipse 0,0,#ButtonSize#,#ButtonSize# | Fill Color 12,13,14,250 | StrokeWidth 1 | Stroke Color 255,255,255,75"][!UpdateMeter ButtonDownloads][!Redraw]
MouseLeaveAction=[!SetOption ButtonDownloads Shape "Ellipse 0,0,#ButtonSize#,#ButtonSize# | Fill Color 3,4,5,245 | StrokeWidth 1 | Stroke Color 255,255,255,35"][!UpdateMeter ButtonDownloads][!Redraw]
LeftMouseUpAction=["%USERPROFILE%\Downloads"]
CursorName=Hand

[IconDownloads]
Meter=Image
ImageName=downloads.png
X=52
Y=135
W=#IconSize#
H=#IconSize#
AntiAlias=1
LeftMouseUpAction=["%USERPROFILE%\Downloads"]
CursorName=Hand

[TextDownloads]
Meter=String
Text=Downloads
X=64
Y=185
W=#TextW#
H=18
StringAlign=Center
FontFace=Segoe UI
FontSize=8
FontColor=245,245,245,255
AntiAlias=1
LeftMouseUpAction=["%USERPROFILE%\Downloads"]
CursorName=Hand

; ============================================================
; RECYCLE BIN
; ============================================================
[ButtonRecycle]
Meter=Shape
X=#ButtonX#
Y=#RecycleY#
Shape=Ellipse 0,0,#ButtonSize#,#ButtonSize# | Fill Color 3,4,5,245 | StrokeWidth 1 | Stroke Color 255,255,255,35
MouseOverAction=[!SetOption ButtonRecycle Shape "Ellipse 0,0,#ButtonSize#,#ButtonSize# | Fill Color 12,13,14,250 | StrokeWidth 1 | Stroke Color 255,255,255,75"][!UpdateMeter ButtonRecycle][!Redraw]
MouseLeaveAction=[!SetOption ButtonRecycle Shape "Ellipse 0,0,#ButtonSize#,#ButtonSize# | Fill Color 3,4,5,245 | StrokeWidth 1 | Stroke Color 255,255,255,35"][!UpdateMeter ButtonRecycle][!Redraw]
LeftMouseUpAction=["shell:RecycleBinFolder"]
CursorName=Hand

[IconRecycle]
Meter=Image
ImageName=recycle.png
X=52
Y=225
W=#IconSize#
H=#IconSize#
AntiAlias=1
LeftMouseUpAction=["shell:RecycleBinFolder"]
CursorName=Hand

[TextRecycle]
Meter=String
Text=Recycle Bin
X=64
Y=275
W=#TextW#
H=18
StringAlign=Center
FontFace=Segoe UI
FontSize=8
FontColor=245,245,245,255
AntiAlias=1
LeftMouseUpAction=["shell:RecycleBinFolder"]
CursorName=Hand
