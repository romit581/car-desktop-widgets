[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Microma Weather
Author=Romit
Version=4.0

; ============================================================
; VARIABLES
; ============================================================

[Variables]
FontMain=Bahnschrift
FontTemp=Michroma

; ============================================================
; WEATHER - TEMPERATURE
; ============================================================

[MeasureTemp]
Measure=WebParser
URL=https://wttr.in/?format=j1
RegExp=(?siU)"temp_C"\s*:\s*"([^"]+)"
StringIndex=1
UpdateRate=600
CodePage=65001
UserAgent=Mozilla/5.0

; ============================================================
; WEATHER - CONDITION
; ============================================================

[MeasureCondition]
Measure=WebParser
URL=https://wttr.in/?format=j1
RegExp=(?siU)"weatherDesc"\s*:\s*\[\s*\{\s*"value"\s*:\s*"([^"]+)"
StringIndex=1
UpdateRate=600
CodePage=65001
UserAgent=Mozilla/5.0

; ============================================================
; WEATHER - LOCATION
; ============================================================

[MeasureLocation]
Measure=WebParser
URL=https://wttr.in/?format=j1
RegExp=(?siU)"areaName"\s*:\s*\[\s*\{\s*"value"\s*:\s*"([^"]+)"
StringIndex=1
UpdateRate=600
CodePage=65001
UserAgent=Mozilla/5.0

; ============================================================
; CLOUD ICON
; ============================================================

[MeterCloud]
Meter=Image
ImageName=#@#cloud.png
X=29
Y=29
W=48
H=32
AntiAlias=1

; ============================================================
; TEMPERATURE
; ============================================================

[MeterTemp]
Meter=String
MeasureName=MeasureTemp
X=82
Y=28
W=95
H=35
Text=%1
FontFace=#FontTemp#
FontSize=21
FontColor=20,20,20,255
StringStyle=Normal
AntiAlias=1
ClipString=1

; ============================================================
; DEGREE DOT
; ============================================================

[MeterDegree]
Meter=Shape
X=176
Y=28
Shape=Ellipse 0,0,5,5 | Fill Color 20,20,20,255 | StrokeWidth 0

; ============================================================
; LOCATION
; ============================================================

[MeterLocation]
Meter=String
MeasureName=MeasureLocation
X=29
Y=68
W=220
H=25
Text=%1
FontFace=#FontMain#
FontSize=13
FontColor=20,20,20,255
StringStyle=Normal
AntiAlias=1
ClipString=1

; ============================================================
; CONDITION
; ============================================================

[MeterCondition]
Meter=String
MeasureName=MeasureCondition
X=29
Y=89
W=250
H=22
Text=%1
FontFace=Tahoma
FontSize=10
FontColor=105,105,105,255
StringStyle=Normal
AntiAlias=1
ClipString=1

; ============================================================
; RED ACCENT
; ============================================================

[MeterRed]
Meter=Shape
X=30
Y=130
Shape=Rectangle 0,0,35,3 | Fill Color 235,55,55,255 | StrokeWidth 0

; ============================================================
; SAME PASSION
; ============================================================

[MeterBottom1]
Meter=String
X=30
Y=150
W=220
H=20
Text=SAME PASSION
FontFace=#FontMain#
FontSize=8
FontColor=65,65,65,255
AntiAlias=1
CharacterSpacing=2

; ============================================================
; DIFFERENT DAY
; ============================================================

[MeterBottom2]
Meter=String
X=30
Y=171
W=240
H=20
Text=DIFFERENT DAY
FontFace=#FontMain#
FontSize=8
FontColor=65,65,65,255
AntiAlias=1
CharacterSpacing=2